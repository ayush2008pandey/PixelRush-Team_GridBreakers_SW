<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawPal - Who needs help?</title>
    <link rel="stylesheet" href="emergency.css">
    <!-- Using Google Fonts (Inter) and FontAwesome for quick icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="iphone-frame">
    
    <!-- Header with Back Button -->
    <header class="header">
        <a href="index.html" class="back-btn" aria-label="Back to home">
            <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h1 class="header-title">Who needs help?</h1>
    </header>

    <!-- Subtitle Prompt -->
    <section class="prompt-section">
        <h2 class="prompt-title">Select a Pet</h2>
    </section>

   <!-- Pet Profile Cards -->
    <section class="pet-selection">
        <!-- Bruno's Card -> Routes to symptoms.html -->
        <a href="symptoms.html" class="pet-card bruno-card">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=150&q=80" alt="Bruno the Golden Retriever" class="pet-avatar">
            <div class="pet-info">
                <h3 class="pet-name">Bruno</h3>
                <p class="pet-breed">Golden Retriever</p>
                <div class="pet-stats">
                    <span>🎂 3 yrs</span>
                    <span>⚖️ 28 kg</span>
                    <span>♂ Male</span>
                </div>
            </div>
        </a>

        <!-- Luna's Card -> Routes to symptoms.html -->
        <a href="symptoms.html" class="pet-card luna-card">
            <!-- Using the highly reliable Husky photo with fallback -->
            <img src="https://images.unsplash.com/photo-1531804055935-76f44d7c3621?auto=format&fit=crop&q=80&w=150" alt="Luna the Siberian Husky" class="pet-avatar" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&q=80&w=150';">
            <div class="pet-info">
                <h3 class="pet-name">Luna</h3>
                <p class="pet-breed">Siberian Husky</p>
                <div class="pet-stats">
                    <span>🎂 2 yrs</span>
                    <span>⚖️ 18 kg</span>
                    <span>♀ Female</span>
                </div>
            </div>
        </a>
    </section>

    <!-- Unlisted Pet Flow Option -->
    <section class="alt-options">
        <a href="#" class="btn-not-listed">My pet is not listed</a>
    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=50&q=80" alt="Profile" class="nav-avatar">
        </a>
        <!-- Click at Dog logo in the nav bar navigates back to index.html as requested -->
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-dog"></i>
        </a>
        <a href="complete.html" class="nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </a>
        <a href="track.html" class="nav-item">
            <i class="fa-solid fa-location-dot"></i>
        </a>
    </nav>

</div>

</body>
</html>
